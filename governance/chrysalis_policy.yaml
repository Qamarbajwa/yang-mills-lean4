# Local Policy-as-Code Configuration for Google Cloud Project Chrysalis Reference Architecture
policy_version: "1.0.0"
framework: "Google Cloud Project Chrysalis Local Reference Architecture"
workspace: "yang mills and the mass gap"

gate_1_ast_ingress:
  forbidden_calls:
    - "os.system"
    - "posix.system"
    - "nt.system"
  forbidden_modules:
    - "socket"
    - "urllib"
    - "urllib.request"
    - "requests"
    - "http.client"
    - "aiohttp"
    - "httpx"
    - "ftplib"
    - "telnetlib"
  forbidden_subprocess_commands:
    - "curl"
    - "wget"
    - "ssh"
    - "nc"
    - "netcat"
    - "ping"
    - "telnet"
    - "ftp"
  exact_rational_certificate_rules:
    enforce_on_candidate_certificates: true
    enforce_on_pragma: "EXACT_RATIONAL_CERTIFICATE"
    disallow_float_calls: true
    disallow_float_literals: true

gate_2_policy_rules:
  rational_bounds:
    min_margin_threshold: "1/57"
    strict_positivity_required: true
    max_cluster_weight: "1"
    max_cauchy_remainder: "187/7872"
  claim_evidence_matrix:
    source_file: "CLAIM_EVIDENCE_MATRIX.md"
    require_all_mapped: true
    allowed_statuses:
      - "VERIFIED_FROM_PRIMARY_SOURCE"
      - "PARTIAL_SOURCE_DEFINITION"
