unknown_policy:
  research_locations:
    - literature/
    - proofs/
    - derivations/
  research_filename_markers:
    - LEDGER
    - THEOREM
    - LEMMA
    - HYPOTHESIS
    - EVIDENCE
    - SPECIFICATION
    - MATRIX
    - GRAPH
    - PROOF
    - SOURCE
    - RESEARCH
    - PATHWAY
  action: FAIL_CLOSED
  rule: >-
    A newly discovered research-shaped artifact must be explicitly classified
    and, when SCIENTIFIC, added to the canonical fingerprint in the same change.
